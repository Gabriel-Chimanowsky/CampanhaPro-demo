<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CampanhaPro — Vídeo Comercial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050a13; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
    .video-container { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
    .placeholder-content { text-align: center; color: #22d3ee; }
    svg { width: 150px; height: 150px; margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    h1 { font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="video-container">
    <div class="placeholder-content">
      <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <circle cx="600" cy="400" r="180" fill="none" stroke="#22d3ee" stroke-width="10"></circle>
        <text x="600" y="445" font-family="sans-serif" font-weight="700" font-size="180" fill="#22d3ee" text-anchor="middle">CP</text>
      </svg>
      <h1>CampanhaPro</h1>
      <p style="color: #94a3b8; margin-top: 10px;">Inteligência Eleitoral</p>
    </div>
  </div>

</html>
